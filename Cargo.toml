[package]
name    = "ssh-quic"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes       = "1.12.1"
knell       = "1.0.1"
misstep     = { version = "0.4.1", features = [ "pretty" ] }
pound       = "0.6.1"
quinn-proto = { version = "0.11.19", default-features = false, features = [ "rustls-ring" ] }
quinn-udp   = { version = "0.6.3", default-features = false }
ring        = "0.17.14"
rustix      = {
  version  = "1.1.6",
  features = [ "event", "net", "process", "pty", "termios", "thread", "time" ]
}
rustls      = { version = "0.23.46", default-features = false, features = [ "ring", "std" ] }
thiserror   = "2.0.21"
zeroize     = "1.9.1"

[lints.clippy]
nursery  = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
lto   = "thin"
