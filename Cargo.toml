[package]
name        = "quicsh"
version     = "0.1.0"
edition     = "2024"
description = "SSH replacement over QUIC with a privilege-separated server"
repository  = "https://github.com/amaanq/quicsh"
license     = "EUPL-1.2"
keywords    = [ "port-forwarding", "quic", "remote-shell", "ssh", "tunnel" ]
categories  = [ "command-line-utilities", "network-programming" ]

[dependencies]
bytes       = "1.12.1"
flub        = "0.1.0"
knell       = "1.0.1"
misstep     = { version = "0.4.1", features = [ "pretty" ] }
ml-kem      = { version = "0.3.4", features = [ "getrandom", "zeroize" ] }
p521        = { version = "0.14.0", default-features = false, features = [ "ecdsa" ] }
pound       = "0.6.1"
quinn-proto = { version = "0.11.19", default-features = false, features = [ "rustls-ring" ] }
quinn-udp   = { version = "0.6.3", default-features = false }
ring        = "0.17.14"
rustix      = {
  version  = "1.1.6",
  features = [
    "event",
    "fs",
    "net",
    "process",
    "pty",
    "stdio",
    "termios",
    "thread",
    "time",
  ]
}
rustls      = { version = "0.23.46", default-features = false, features = [ "ring", "std" ] }
zeroize     = "1.9.1"

[lints.clippy]
cargo       = { level = "warn", priority = -1 }
nursery     = { level = "warn", priority = -1 }
pedantic    = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }

blanket_clippy_restriction_lints = "allow"

arbitrary_source_item_ordering  = "allow"
arithmetic_side_effects         = "allow"
as_conversions                  = "allow"
big_endian_bytes                = "allow"
default_numeric_fallback        = "allow"
else_if_without_else            = "allow"
error_impl_error                = "allow"
exhaustive_enums                = "allow"
exhaustive_structs              = "allow"
float_arithmetic                = "allow"
implicit_return                 = "allow"
indexing_slicing                = "allow"
integer_division                = "allow"
integer_division_remainder_used = "allow"
let_underscore_must_use         = "allow"
let_underscore_untyped          = "allow"
map_err_ignore                  = "allow"
missing_inline_in_public_items  = "allow"
missing_trait_methods           = "allow"
module_name_repetitions         = "allow"
multiple_crate_versions         = "allow"
must_use_without_reason         = "allow"
print_stderr                    = "allow"
print_stdout                    = "allow"
question_mark_used              = "allow"
ref_patterns                    = "allow"
renamed_function_params         = "allow"
rest_pat_in_fully_bound_structs = "allow"
rest_pattern_accessible_field   = "allow"
separated_literal_suffix        = "allow"
single_call_fn                  = "allow"
std_instead_of_alloc            = "allow"
std_instead_of_core             = "allow"
tests_outside_test_module       = "allow"
wildcard_enum_match_arm         = "allow"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
lto   = "thin"
